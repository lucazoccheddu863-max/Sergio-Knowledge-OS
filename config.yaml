database_path: ./data/sergio_knowledge.db
archive_root: ./data/archive
chatgpt_import_dir: ./data/imports/chatgpt
gemini_import_dir: ./data/imports/gemini
backup_dir: ./data/backups
release_dir: ./data/releases
hash_algorithm: sha256
ai_primary_provider: ollama
ai_local_model: qwen2.5:1.5b
ai_embedding_model: nomic-embed-text

ai_providers:
  ollama:
    base_url: http://127.0.0.1:11434/api
    timeout: 300

m7:
  index_generation: m7_9
  vector_store:
    path: ./data/chroma

m6:
  environment: development

m5:
  persistence:
    mode: memory

  redis:
    url: "redis://localhost:6379/0"

  postgresql:
    dsn: "postgresql://localhost:5432/skos"

  rate_limit:
    default_limit: 60
    default_window_seconds: 60.0
    overrides: {}

  runtime:
    fallback_to_memory: true

m4:
  semantic_search:
    collection_name: "semantic_search_m7_9"
    default_top_k: 5
    similarity_threshold: 0.7
    max_results_per_query: 20
    rerank_enabled: false

  embedding:
    document_prefix: "search_document: "
    query_prefix: "search_query: "

  rag:
    default_top_k: 5
    system_prompt: "Rispondi in italiano usando esclusivamente il contesto fornito. Sintetizza i fatti rilevanti e non inventare informazioni. Se il contesto non contiene la risposta, dichiaralo chiaramente."

  knowledge_graph:
    default_depth: 2
    max_results: 50

  orchestrator:
    default_mode: "auto"
    max_query_time_ms: 30000
